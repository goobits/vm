name: vm-packages

services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", ":8080", "--to", "registry:3080"]
    ports:
      - "${VM_PACKAGES_BIND:?required}:${VM_PACKAGES_PORT:?required}:8080"
    depends_on:
      registry:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - gateway-data:/data
      - gateway-config:/config
    networks: [packages]

  registry:
    image: "${VM_PACKAGES_REGISTRY_IMAGE:?required}"
    restart: unless-stopped
    environment:
      RUST_LOG: info
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PKG_SERVER_AUTH_TOKEN="$$(cat /run/secrets/registry_publish_token)"
        exec pkg-server start --host 0.0.0.0 --port 3080 --data /data
    secrets: [registry_publish_token]
    expose: ["3080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - registry-npm-artifacts:/data/npm
      - registry-cargo-artifacts:/data/cargo
      - registry-pypi-artifacts:/data/pypi
      - registry-upstream-cache:/data/cache
      - registry-metadata:/data/metadata
    networks: [packages, egress]

networks:
  packages:
    name: vm-packages
    internal: true
  egress:
    name: vm-packages-egress

secrets:
  registry_publish_token:
    file: ./publish-token

volumes:
  gateway-data:
  gateway-config:
  registry-npm-artifacts:
  registry-cargo-artifacts:
  registry-pypi-artifacts:
  registry-upstream-cache:
  registry-metadata:
  workflow-state:
  workflow-receipts:
  agent-temporary-data:

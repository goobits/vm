name: vm-packages

services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    ports:
      - "${VM_PACKAGES_BIND:?required}:${VM_PACKAGES_PORT:?required}:8080"
    depends_on:
      oci-cache:
        condition: service_healthy
      registry:
        condition: service_healthy
      work:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - gateway-data:/data
      - gateway-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [packages]

  oci-cache:
    image: registry:3.1.1
    restart: unless-stopped
    environment:
      OTEL_TRACES_EXPORTER: none
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_PROXY_TTL: 168h
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - registry-oci-cache:/var/lib/registry
    networks: [packages, egress]

  registry:
    image: "${VM_PACKAGES_REGISTRY_IMAGE:?required}"
    restart: unless-stopped
    environment:
      RUST_LOG: info
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PKG_SERVER_READ_TOKEN="$$(cat /run/secrets/registry_read_token)"
        export PKG_SERVER_PUBLISH_TOKEN="$$(cat /run/secrets/registry_publish_token)"
        export PKG_SERVER_INTERNAL_CATALOG=/catalog/packages.json
        exec pkg-server start --host 0.0.0.0 --port 3080 --data /data
    secrets: [registry_read_token, registry_publish_token]
    expose: ["3080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - registry-metadata:/data
      - registry-npm-artifacts:/data/npm/tarballs
      - registry-cargo-artifacts:/data/cargo/crates
      - registry-pypi-artifacts:/data/pypi/packages
      - registry-tool-artifacts:/data/tools/artifacts
      - registry-upstream-cache:/data/cache
      - package-catalog:/catalog:ro
    networks: [packages, egress]

  work:
    image: "${VM_PACKAGES_REGISTRY_IMAGE:?required}"
    restart: unless-stopped
    environment:
      RUST_LOG: info
      PKG_WORK_GIT_ASKPASS: /usr/local/bin/pkg-git-askpass
      PKG_WORK_GIT_TOKEN_FILE: /run/secrets/git_token
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PKG_WORK_READ_TOKEN="$$(cat /run/secrets/work_read_token)"
        export PKG_WORK_CONTROLLER_TOKEN="$$(cat /run/secrets/work_controller_token)"
        export PKG_WORK_REVIEWER_TOKEN="$$(cat /run/secrets/work_reviewer_token)"
        export PKG_WORK_RELEASE_TOKEN="$$(cat /run/secrets/work_release_token)"
        export PKG_WORK_ROLLOUT_TOKEN="$$(cat /run/secrets/work_rollout_token)"
        exec pkg-work start --host 0.0.0.0 --port 3091 --data /data
    secrets: [work_read_token, work_controller_token, work_reviewer_token, work_release_token, work_rollout_token, git_token]
    expose: ["3091"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3091/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - workflow-state:/data/state
      - workflow-receipts:/data/receipts
      - workflow-logs:/data/logs
      - agent-temporary-data:/data/agents
      - rollout-temporary-data:/data/rollouts
      - source-mirrors:/data/sources
      - package-catalog:/data/catalog
    networks: [packages, egress]

  reviewer:
    profiles: [jobs]
    image: "${VM_PACKAGES_JOB_IMAGE:?required}"
    environment:
      PKG_REVIEW_GATEWAY: http://gateway:8080
      PKG_CLIENT_GATEWAY: http://gateway:8080
      PKG_CLIENT_READ_TOKEN_FILE: /run/secrets/reviewer_read_token
      CARGO_HOME: /tmp/cargo-home
      CARGO_TARGET_DIR: /tmp/cargo-target
      npm_config_cache: /tmp/npm-cache
      PIP_CACHE_DIR: /tmp/pip-cache
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        . /usr/local/lib/pkg-client-env.sh
        export PKG_REVIEW_TOKEN="$$(cat /run/secrets/reviewer_token)"
        exec pkg-review --submission "$${SUBMISSION_ID:?required}"
    secrets: [reviewer_read_token, reviewer_token]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,exec,nosuid,size=4g"]
    volumes:
      - agent-temporary-data:/data/agents:ro
    networks: [packages]

  releaser:
    profiles: [jobs]
    image: "${VM_PACKAGES_JOB_IMAGE:?required}"
    environment:
      PKG_RELEASE_GATEWAY: http://gateway:8080
      PKG_RELEASE_TOKEN_FILE: /run/secrets/release_token
      PKG_RELEASE_PUBLISH_TOKEN_FILE: /run/secrets/publish_token
      PKG_RELEASE_GIT_TOKEN_FILE: /run/secrets/git_token
      PKG_RELEASE_CI_TOKEN_FILE: /run/secrets/ci_publish_token
      PKG_CLIENT_GATEWAY: http://gateway:8080
      PKG_CLIENT_READ_TOKEN_FILE: /run/secrets/releaser_read_token
      CARGO_HOME: /tmp/cargo-home
      CARGO_TARGET_DIR: /tmp/cargo-target
      npm_config_cache: /tmp/npm-cache
      PIP_CACHE_DIR: /tmp/pip-cache
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        . /usr/local/lib/pkg-client-env.sh
        exec pkg-release --submission "$${SUBMISSION_ID:?required}" --push-source
    secrets: [releaser_read_token, release_token, publish_token, git_token, ci_publish_token]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,exec,nosuid,size=8g"]
    networks: [packages, egress]

  rollout:
    profiles: [jobs]
    image: "${VM_PACKAGES_JOB_IMAGE:?required}"
    environment:
      PKG_ROLLOUT_GATEWAY: http://gateway:8080
      PKG_ROLLOUT_TOKEN_FILE: /run/secrets/rollout_token
      PKG_CLIENT_GATEWAY: http://gateway:8080
      PKG_CLIENT_READ_TOKEN_FILE: /run/secrets/rollout_read_token
      CARGO_HOME: /tmp/cargo-home
      CARGO_TARGET_DIR: /tmp/cargo-target
      npm_config_cache: /tmp/npm-cache
      PIP_CACHE_DIR: /tmp/pip-cache
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        . /usr/local/lib/pkg-client-env.sh
        exec pkg-rollout --rollout "$${ROLLOUT_ID:?required}"
    secrets: [rollout_read_token, rollout_token]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,exec,nosuid,size=8g"]
    networks: [packages]

  maintenance:
    profiles: [maintenance]
    image: "${VM_PACKAGES_JOB_IMAGE:?required}"
    user: "0:0"
    environment:
      BACKUP_ACTION: "${BACKUP_ACTION:-list}"
      BACKUP_ID: "${BACKUP_ID:-}"
      VM_PACKAGES_VERSION: "${VM_PACKAGES_VERSION:-unknown}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        datasets="gateway_data gateway_config oci npm cargo pypi tools cache metadata state receipts logs agents rollouts sources catalog"
        valid_id() {
          test -n "$${BACKUP_ID}" &&
          test "$${#BACKUP_ID}" -le 160 &&
          case "$${BACKUP_ID}" in *[!A-Za-z0-9_-]*) false;; *) true;; esac
        }
        case "$${BACKUP_ACTION}" in
          list)
            find /backups -mindepth 1 -maxdepth 1 -type d -name 'backup-*' -printf '%f\n' | sort
            ;;
          backup)
            valid_id || { echo "invalid backup identifier" >&2; exit 2; }
            final="/backups/$${BACKUP_ID}"
            temporary="/backups/.$${BACKUP_ID}.tmp"
            test ! -e "$${final}" && test ! -e "$${temporary}" || {
              echo "backup already exists: $${BACKUP_ID}" >&2
              exit 3
            }
            mkdir "$${temporary}"
            for dataset in $${datasets}; do
              tar --numeric-owner -C "/volumes/$${dataset}" -czf "$${temporary}/$${dataset}.tar.gz" .
            done
            {
              echo "backup_id=$${BACKUP_ID}"
              echo "created_at=$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "controller_version=$${VM_PACKAGES_VERSION}"
              echo "datasets=$${datasets}"
            } > "$${temporary}/receipt.txt"
            (cd "$${temporary}" && sha256sum *.tar.gz receipt.txt > manifest.sha256)
            mv "$${temporary}" "$${final}"
            echo "$${BACKUP_ID}"
            ;;
          restore)
            valid_id || { echo "invalid backup identifier" >&2; exit 2; }
            source="/backups/$${BACKUP_ID}"
            test -d "$${source}" || { echo "backup not found: $${BACKUP_ID}" >&2; exit 4; }
            (cd "$${source}" && sha256sum --check manifest.sha256)
            touch "$${source}/restore-in-progress"
            for dataset in $${datasets}; do
              target="/volumes/$${dataset}"
              find "$${target}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
              tar --numeric-owner -C "$${target}" -xzf "$${source}/$${dataset}.tar.gz"
            done
            rm -f "$${source}/restore-in-progress"
            date -u +%Y-%m-%dT%H:%M:%SZ > "$${source}/restored-at.txt"
            echo "$${BACKUP_ID}"
            ;;
          *)
            echo "unsupported maintenance action: $${BACKUP_ACTION}" >&2
            exit 2
            ;;
        esac
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    network_mode: none
    volumes:
      - infrastructure-backups:/backups
      - gateway-data:/volumes/gateway_data
      - gateway-config:/volumes/gateway_config
      - registry-oci-cache:/volumes/oci
      - registry-npm-artifacts:/volumes/npm
      - registry-cargo-artifacts:/volumes/cargo
      - registry-pypi-artifacts:/volumes/pypi
      - registry-tool-artifacts:/volumes/tools
      - registry-upstream-cache:/volumes/cache
      - registry-metadata:/volumes/metadata
      - workflow-state:/volumes/state
      - workflow-receipts:/volumes/receipts
      - workflow-logs:/volumes/logs
      - agent-temporary-data:/volumes/agents
      - rollout-temporary-data:/volumes/rollouts
      - source-mirrors:/volumes/sources
      - package-catalog:/volumes/catalog

networks:
  packages:
    name: vm-packages
    internal: true
  egress:
    name: vm-packages-egress

secrets:
  registry_read_token:
    file: ./read-token
  registry_publish_token:
    file: ./publish-token
  work_read_token:
    file: ./read-token
  work_controller_token:
    file: ./controller-token
  work_reviewer_token:
    file: ./reviewer-token
  work_release_token:
    file: ./release-token
  work_rollout_token:
    file: ./rollout-token
  reviewer_read_token:
    file: ./read-token
  reviewer_token:
    file: ./reviewer-token
  release_token:
    file: ./release-token
  releaser_read_token:
    file: ./read-token
  rollout_read_token:
    file: ./read-token
  rollout_token:
    file: ./rollout-token
  git_token:
    file: ./git-token
  ci_publish_token:
    file: ./ci-publish-token

volumes:
  gateway-data:
  gateway-config:
  registry-oci-cache:
  registry-npm-artifacts:
  registry-cargo-artifacts:
  registry-pypi-artifacts:
  registry-tool-artifacts:
  registry-upstream-cache:
  registry-metadata:
  workflow-state:
  workflow-receipts:
  workflow-logs:
  agent-temporary-data:
  rollout-temporary-data:
  source-mirrors:
  package-catalog:
  infrastructure-backups:

[package]
name = "vm-provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tracing = { workspace = true, optional = true }
duct = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
serde_yaml_ng = { workspace = true, optional = true }
tera = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
vm-core = { path = "../vm-core" }
vm-config = { path = "../vm-config" }
vm-messages = { path = "../vm-messages", optional = true }
vm-platform = { path = "../vm-platform", optional = true }
vm-snapshot = { path = "../vm-snapshot", optional = true }
chrono = { workspace = true }
rayon = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "rt"], optional = true }
base64 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
indexmap = { workspace = true }

[features]
default = ["docker"]
docker = [
    "dep:duct",
    "dep:fs2",
    "dep:rayon",
    "dep:serde_json",
    "dep:serde_yaml_ng",
    "dep:sha2",
    "dep:tera",
    "dep:tokio",
    "dep:tracing",
    "dep:vm-messages",
    "dep:vm-platform",
    "dep:vm-snapshot",
]
tart = [
    "dep:base64",
    "dep:duct",
    "dep:fs2",
    "dep:serde_json",
    "dep:serde_yaml_ng",
    "dep:tera",
    "dep:tracing",
    "dep:uuid",
    "dep:vm-messages",
    "dep:vm-platform",
]
test-helpers = ["dep:tracing", "vm-config/test-helpers"]

---
# Reusable service management task
# This task handles the installation and configuration of a single service
# Variables expected:
#   - service_name: The name of the service (e.g., 'postgresql', 'redis', 'mongodb')
#   - service_config: The service configuration from project_config.services[service_name]
#   - project_config: The full project configuration
#   - is_docker_container: Boolean indicating if running in Docker

- name: "Validate {{ service_name }} service definition"
  assert:
    that:
      - service_name is match('^[a-z][a-z0-9_-]{0,63}$')
      - service_systemd_name == '' or service_systemd_name is match('^[A-Za-z0-9_.@-]{1,128}$')
      - service_supervisor_user == '' or service_supervisor_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - service_port == '' or ((service_port | string) is match('^[0-9]+$') and (service_port | int) >= 1 and (service_port | int) <= 65535)
    quiet: true
    fail_msg: "Refusing unsafe {{ service_name }} service definition"

- name: "Validate MySQL database identifier"
  assert:
    that:
      - (project_config.services.mysql.database | default(project_config.project.name + '_dev')) is match('^[A-Za-z0-9_]{1,64}$')
    quiet: true
    fail_msg: Refusing unsafe MySQL database identifier
  when: service_name == 'mysql'

- name: "Reset {{ service_name }} discovered version"
  set_fact:
    service_version: ''

- name: "Install {{ service_name }} dependencies"
  apt:
    name: "{{ service_dependencies }}"
    state: present
  when: service_dependencies | length > 0

- name: "Add {{ service_name }} GPG key"
  apt_key:
    url: "{{ service_gpg_key_url }}"
    state: present
  when: service_gpg_key_url != ""

- name: "Add {{ service_name }} repository"
  apt_repository:
    repo: "{{ service_repository }}"
    state: present
    update_cache: yes
  when: service_repository != ""

- name: "Install {{ service_name }} packages"
  apt:
    name: "{{ service_packages }}"
    state: present
  when: service_packages | length > 0

- name: "Configure {{ service_name }}"
  lineinfile:
    path: "{{ item.path }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop: "{{ service_config_lines }}"
  notify: "restart {{ service_name }}"
  when: service_config_lines | length > 0

- name: "Get {{ service_name }} version (if needed)"
  command:
    argv: "{{ service_version_command_argv }}"
  register: service_version_result
  changed_when: false
  when: service_version_command_argv | length > 0

- name: "Select {{ service_name }} version"
  set_fact:
    service_version: "{{ service_version_result.stdout_lines | select('match', '^[0-9]+$') | sort | first }}"
  when: service_version_command_argv | length > 0

- name: "Validate {{ service_name }} version"
  assert:
    that:
      - service_version is match('^[0-9]+$')
    quiet: true
  when: service_version_command_argv | length > 0

- name: "Configure {{ service_name }} with version-specific paths"
  lineinfile:
    path: "{{ item.path | replace('VERSION', service_version) }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop: "{{ service_versioned_config_lines }}"
  notify: "restart {{ service_name }}"
  when:
    - service_versioned_config_lines | length > 0
    - service_version | length > 0

- name: "Enable and start {{ service_name }} service (systemd)"
  systemd:
    name: "{{ service_systemd_name if service_systemd_name != '' else service_name }}"
    enabled: yes
    state: started
    daemon_reload: "{{ service_systemd_daemon_reload }}"
  when:
    - not is_docker_container
    - service_systemd_name != "" or service_name is defined
  notify: "restart {{ service_name }}"

- name: "Force systemd service restart for {{ service_name }}"
  meta: flush_handlers
  when:
    - not is_docker_container
    - service_systemd_name != "" or service_name is defined

- name: "Create {{ service_name }} supervisor config (Docker)"
  copy:
    dest: "/etc/supervisor/conf.d/{{ service_name }}.conf"
    content: |
      [program:{{ service_name }}]
      command={{ service_supervisor_command | replace('VERSION', service_version) if service_version | length > 0 else service_supervisor_command }}
      user={{ service_supervisor_user if service_supervisor_user != '' else 'root' }}
      autostart=true
      autorestart=true
      stderr_logfile=/dev/stderr
      stderr_logfile_maxbytes=0
      stdout_logfile=/dev/stdout
      stdout_logfile_maxbytes=0
      {% if service_supervisor_environment != '' %}
      environment={{ service_supervisor_environment }}
      {% endif %}
  when:
    - is_docker_container
    - service_supervisor_command != ""
  notify: restart supervisor

- name: "Apply supervisor config for {{ service_name }} (Docker)"
  meta: flush_handlers
  when:
    - is_docker_container
    - service_supervisor_command != ""

- name: "Wait for {{ service_name }} to be ready"
  wait_for:
    port: "{{ service_port }}"
    host: localhost
    delay: 2
    timeout: 30
  when: service_port != ""

- name: "Check whether PulseAudio is already running"
  command:
    argv:
      - pulseaudio
      - --check
      - -v
  register: pulseaudio_check
  changed_when: false
  failed_when: pulseaudio_check.rc not in [0, 1]
  when: service_name == 'audio'

- name: "Start PulseAudio when needed"
  command:
    argv:
      - pulseaudio
      - --system
      - --start
  when:
    - service_name == 'audio'
    - pulseaudio_check.rc != 0

- name: "Check current MySQL root credential"
  command:
    argv: [mysql, -u, root, --execute, 'SELECT 1']
  environment:
    MYSQL_PWD: "{{ project_config.services.mysql.password | default('mysql') }}"
  register: mysql_credential_check
  changed_when: false
  failed_when: false
  no_log: true
  when: service_name == 'mysql'

- name: "Set initial MySQL root credential"
  command:
    argv:
      - mysqladmin
      - -u
      - root
      - password
      - "{{ project_config.services.mysql.password | default('mysql') }}"
  no_log: true
  when:
    - service_name == 'mysql'
    - mysql_credential_check.rc != 0

- name: "Create configured MySQL database"
  command:
    argv:
      - mysql
      - -u
      - root
      - --execute
      - "CREATE DATABASE IF NOT EXISTS `{{ project_config.services.mysql.database | default(project_config.project.name + '_dev') }}`;"
  environment:
    MYSQL_PWD: "{{ project_config.services.mysql.password | default('mysql') }}"
  no_log: true
  when: service_name == 'mysql'

- name: "Run {{ service_name }} post-installation actions"
  command:
    argv: "{{ item.argv }}"
    chdir: "{{ item.chdir | default(omit) }}"
  environment: "{{ item.environment | default({}) }}"
  register: service_post_action
  failed_when: >-
    service_post_action.rc not in (item.allowed_rcs | default([0])) and
    (item.allowed_error | default('') == '' or item.allowed_error not in service_post_action.stderr)
  changed_when: item.changed | default(true) | bool
  no_log: "{{ item.no_log | default(false) | bool }}"
  loop: "{{ service_post_install_actions }}"
  loop_control:
    label: "{{ service_name }} action {{ ansible_loop.index }}"
    extended: true
  when: service_post_install_actions | length > 0

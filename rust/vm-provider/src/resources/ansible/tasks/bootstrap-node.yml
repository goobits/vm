---
- name: Initialize managed volume ownership
  file:
    path: '{{ item.value.target }}'
    state: directory
    owner: '{{ project_uid }}'
    group: '{{ project_gid }}'
    mode: '0755'
  loop: "{{ project_config.get('storage', {}).get('volumes', {}) | dict2items }}"
  become: yes

- name: Bootstrap locked Node dependencies
  shell: |
    set -euo pipefail
    umask 077
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    cd {{ project_path | quote }}

    if [ -f pnpm-lock.yaml ]; then
      manager="pnpm"
      lockfile="pnpm-lock.yaml"
      manager_version="$(pnpm --version)"
    else
      manager="npm"
      lockfile="package-lock.json"
      manager_version="$(npm --version)"
    fi

    npmrc_digest="absent"
    if [ -f .npmrc ]; then
      npmrc_digest="$(
        awk '
          /^[[:space:]]*([#;]|$)/ { next }
          {
            key = $0
            sub(/=.*/, "", key)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
            secret_key = tolower(key)
            if (secret_key ~ /(^|:)(_auth|_authtoken|token|password|username|email|certfile|keyfile)$/)
              next
            line = $0
            sub(/\/\/[^\/@[:space:]]+@/, "//<redacted>@", line)
            print line
          }
        ' .npmrc | sha256sum | awk '{print $1}'
      )"
    fi

    libc="$(getconf GNU_LIBC_VERSION 2>/dev/null || true)"
    if [ -z "$libc" ]; then
      libc="$(ldd --version 2>&1 | sed -n '1p')"
    fi
    fingerprint="$(
      {
        printf 'format=1\nmanager=%s@%s\n' "$manager" "$manager_version"
        printf 'node=%s\nos=%s\narch=%s\nlibc=%s\nimage=%s\n' \
          "$(node --version)" "$(uname -s)" "$(uname -m)" "$libc" \
          "${VM_IMAGE_IDENTITY:-unknown}"
        for file in package.json "$lockfile" pnpm-workspace.yaml; do
          if [ -f "$file" ]; then
            printf '%s=' "$file"
            sha256sum "$file" | awk '{print $1}'
          fi
        done
        printf '.npmrc=%s\n' "$npmrc_digest"
      } | sha256sum | awk '{print $1}'
    )"

    stamp="$PWD/node_modules/.vm-dependencies.sha256"
    installed_entry=""
    if [ -d node_modules ]; then
      installed_entry="$(find node_modules -mindepth 1 -maxdepth 1 \
        ! -name '.vm-dependencies.sha256' -print -quit)"
    fi

    if [ -z "$installed_entry" ] || [ ! -f "$stamp" ] || \
       [ "$(cat "$stamp")" != "$fingerprint" ]; then
      export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      if [ "$manager" = "pnpm" ]; then
        pnpm install --frozen-lockfile
      else
        npm ci
      fi
      stamp_tmp="${stamp}.tmp.$$"
      printf '%s\n' "$fingerprint" > "$stamp_tmp"
      mv -f "$stamp_tmp" "$stamp"
      echo 'VM_BOOTSTRAP_DEPENDENCIES_CHANGED=1'
    else
      echo 'VM_BOOTSTRAP_DEPENDENCIES_CURRENT=1'
    fi
  args:
    executable: /bin/bash
  environment:
    HOME: '{{ home_dir }}'
  become_user: '{{ project_user }}'
  async: 1800
  poll: 30
  register: dependency_bootstrap
  changed_when: "'VM_BOOTSTRAP_DEPENDENCIES_CHANGED=1' in dependency_bootstrap.stdout"
  when:
    - bootstrap_dependencies_enabled
    - package_json_exists
    - pnpm_lock_exists or npm_lock_exists

- name: Ensure Playwright browser cache ownership
  file:
    path: '{{ home_dir }}/.cache/ms-playwright'
    state: directory
    owner: '{{ project_uid }}'
    group: '{{ project_gid }}'
    mode: '0755'
  become: yes
  when: playwright_browsers | length > 0

- name: Bootstrap Playwright browser versions
  shell: |
    set -euo pipefail
    umask 077
    export NVM_DIR="$HOME/.nvm"
    [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    cd {{ project_path | quote }}

    mapfile -t browsers < <(
      printf '%s\n' $VM_PLAYWRIGHT_BROWSERS | sed '/^$/d' | LC_ALL=C sort -u
    )
    mapfile -d '' playwright_clis < <(
      find node_modules -type f -path '*/playwright-core/cli.js' -print0 | sort -z
    )
    if [ "${#playwright_clis[@]}" -eq 0 ]; then
      echo 'Playwright browsers were requested, but no playwright-core CLI was installed.' >&2
      exit 1
    fi

    metadata="$(mktemp)"
    trap 'rm -f "$metadata"' EXIT
    for cli in "${playwright_clis[@]}"; do
      descriptor="$(dirname "$cli")/browsers.json"
      if [ ! -f "$descriptor" ]; then
        continue
      fi
      descriptor_hash="$(sha256sum "$descriptor" | awk '{print $1}')"
      version="$(node "$cli" --version)"
      printf '%s|%s|%s\n' "$descriptor_hash" "$version" "$cli" >> "$metadata"
    done
    LC_ALL=C sort -u -o "$metadata" "$metadata"
    if [ ! -s "$metadata" ]; then
      echo 'No Playwright browser descriptors were found.' >&2
      exit 1
    fi

    libc="$(getconf GNU_LIBC_VERSION 2>/dev/null || true)"
    if [ -z "$libc" ]; then
      libc="$(ldd --version 2>&1 | sed -n '1p')"
    fi
    dependency_fingerprint="$(cat node_modules/.vm-dependencies.sha256 2>/dev/null || true)"
    fingerprint="$(
      {
        printf 'format=1\ndependencies=%s\nos=%s\narch=%s\nlibc=%s\nimage=%s\n' \
          "$dependency_fingerprint" "$(uname -s)" "$(uname -m)" "$libc" \
          "${VM_IMAGE_IDENTITY:-unknown}"
        printf 'browsers=%s\n' "${browsers[*]}"
        cut -d '|' -f 1,2 "$metadata"
      } | sha256sum | awk '{print $1}'
    )"

    stamp="$PLAYWRIGHT_BROWSERS_PATH/.vm-browsers.sha256"
    browser_entry="$(find "$PLAYWRIGHT_BROWSERS_PATH" -mindepth 1 -maxdepth 1 \
      ! -name '.vm-browsers.sha256' -print -quit)"
    if [ -z "$browser_entry" ] || [ ! -f "$stamp" ] || \
       [ "$(cat "$stamp")" != "$fingerprint" ]; then
      previous_descriptor=""
      while IFS='|' read -r descriptor_hash _version cli; do
        if [ "$descriptor_hash" = "$previous_descriptor" ]; then
          continue
        fi
        PLAYWRIGHT_SKIP_BROWSER_GC=1 node "$cli" install "${browsers[@]}"
        previous_descriptor="$descriptor_hash"
      done < "$metadata"
      stamp_tmp="${stamp}.tmp.$$"
      printf '%s\n' "$fingerprint" > "$stamp_tmp"
      mv -f "$stamp_tmp" "$stamp"
      echo 'VM_BOOTSTRAP_BROWSERS_CHANGED=1'
    else
      echo 'VM_BOOTSTRAP_BROWSERS_CURRENT=1'
    fi
  args:
    executable: /bin/bash
  environment:
    HOME: '{{ home_dir }}'
    PLAYWRIGHT_BROWSERS_PATH: '{{ home_dir }}/.cache/ms-playwright'
    VM_PLAYWRIGHT_BROWSERS: '{{ playwright_browsers | join(" ") }}'
  become_user: '{{ project_user }}'
  async: 1800
  poll: 30
  register: playwright_bootstrap
  changed_when: "'VM_BOOTSTRAP_BROWSERS_CHANGED=1' in playwright_bootstrap.stdout"
  when: playwright_browsers | length > 0

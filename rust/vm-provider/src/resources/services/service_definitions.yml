---
# Service configuration definitions for the reusable service management task
# Each service defines the variables needed by tasks/manage-service.yml

# Service definitions organized by category
service_definitions:

  # === DATABASE SERVICES ===
  postgresql:
    service_packages:
      - postgresql
      - postgresql-contrib
    service_version_command_argv:
      - find
      - /etc/postgresql
      - -mindepth
      - '1'
      - -maxdepth
      - '1'
      - -type
      - d
      - -printf
      - '%f\n'
    service_versioned_config_lines:
      - path: "/etc/postgresql/VERSION/main/postgresql.conf"
        regexp: "^#?port ="
        line: "port = {{ project_config.services.postgresql.port | default(5432) }}"
      - path: "/etc/postgresql/VERSION/main/postgresql.conf"
        regexp: "^#?listen_addresses ="
        line: "listen_addresses = 'localhost'"
    service_systemd_name: "postgresql"
    service_supervisor_command: "/usr/lib/postgresql/VERSION/bin/postgres -D /var/lib/postgresql/VERSION/main -c config_file=/etc/postgresql/VERSION/main/postgresql.conf"
    service_supervisor_user: "postgres"
    service_supervisor_environment: "LC_ALL=\"en_US.UTF-8\",LC_CTYPE=\"en_US.UTF-8\""
    service_port: "{{ project_config.services.postgresql.port | default(5432) }}"
    service_post_install_actions:
      - argv:
          - sudo
          - -u
          - postgres
          - --
          - psql
          - -p
          - "{{ project_config.services.postgresql.port | default(5432) | string }}"
          - --set
          - "vm_user={{ project_config.services.postgresql.user | default('postgres') }}"
          - --set
          - "vm_password={{ project_config.services.postgresql.password | default('postgres') }}"
          - --command
          - 'ALTER USER :"vm_user" PASSWORD :''vm_password'';'
        no_log: true
      - argv:
          - sudo
          - -u
          - postgres
          - --
          - createdb
          - -p
          - "{{ project_config.services.postgresql.port | default(5432) | string }}"
          - --
          - "{{ project_config.services.postgresql.database | default(project_config.project.name + '_dev') }}"
        allowed_error: already exists

  mysql:
    service_packages:
      - mysql-server
      - mysql-client
    service_config_lines:
      - path: "/etc/mysql/mysql.conf.d/mysqld.cnf"
        regexp: "^bind-address"
        line: "bind-address = 127.0.0.1"
      - path: "/etc/mysql/mysql.conf.d/mysqld.cnf"
        regexp: "^port"
        line: "port = {{ project_config.services.mysql.port | default(3306) }}"
    service_systemd_name: "mysql"
    service_supervisor_command: "/usr/sbin/mysqld --basedir=/usr --datadir=/var/lib/mysql --plugin-dir=/usr/lib/mysql/plugin --user=mysql --log-error=/var/log/mysql/error.log --pid-file=/var/run/mysqld/mysqld.pid"
    service_supervisor_user: "mysql"
    service_port: "{{ project_config.services.mysql.port | default(3306) }}"

  mongodb:
    service_dependencies:
      - gnupg
      - curl
    service_gpg_key_url: "https://pgp.mongodb.com/server-6.0.asc"
    service_repository: "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse"
    service_packages:
      - mongodb-org
    service_config_lines:
      - path: "/etc/mongod.conf"
        regexp: "^\\s*port:"
        line: "  port: {{ project_config.services.mongodb.port | default(27017) }}"
      - path: "/etc/mongod.conf"
        regexp: "^\\s*bindIp:"
        line: "  bindIp: 127.0.0.1"
    service_systemd_name: "mongod"
    service_systemd_daemon_reload: true
    service_supervisor_command: "/usr/bin/mongod --config /etc/mongod.conf"
    service_supervisor_user: "mongodb"
    service_port: "{{ project_config.services.mongodb.port | default(27017) }}"
    service_post_install_actions:
      - argv:
          - mongosh
          - --port
          - "{{ project_config.services.mongodb.port | default(27017) | string }}"
          - --eval
          - 'db = db.getSiblingDB(process.env.VM_MONGO_DATABASE); if (!db.getCollectionNames().includes("init")) db.createCollection("init");'
        environment:
          VM_MONGO_DATABASE: "{{ project_config.project.name }}_dev"

  # === CACHE & MESSAGE QUEUE SERVICES ===
  redis:
    service_packages:
      - redis-server
      - redis-tools
    service_config_lines:
      - path: "/etc/redis/redis.conf"
        regexp: "^bind"
        line: "bind 127.0.0.1 ::1"
      - path: "/etc/redis/redis.conf"
        regexp: "^port"
        line: "port {{ project_config.services.redis.port | default(6379) }}"
    service_systemd_name: "redis-server"
    service_supervisor_command: "/usr/bin/redis-server --bind 127.0.0.1 ::1 --port {{ project_config.services.redis.port | default(6379) }} --protected-mode yes"
    service_supervisor_user: "redis"
    service_port: "{{ project_config.services.redis.port | default(6379) }}"

  # === DEVELOPMENT & BROWSER SERVICES ===
  headless_browser:
    service_packages:
      - chromium-browser
      - xvfb
    service_systemd_name: "xvfb"
    service_supervisor_command: "/usr/bin/Xvfb :99 -screen 0 1024x768x24 -ac"
    service_supervisor_user: "root"

  # === CONTAINERIZATION SERVICES ===
  docker:
    service_packages:
      - docker-compose
    service_optional_packages:
      buildx: docker-buildx
    # Note: docker.io CLI is included in base Docker image for Docker provider

  # === MULTIMEDIA SERVICES ===
  audio:
    service_packages:
      - pulseaudio
      - pulseaudio-utils
      - alsa-utils
      - alsa-base
    service_config_lines:
      - path: "/etc/pulse/client.conf"
        regexp: "^#?autospawn"
        line: "autospawn = yes"
      - path: "/etc/pulse/client.conf"
        regexp: "^#?default-sink"
        line: "# default-sink = auto"
    service_post_install_actions:
      - argv: [usermod, -a, -G, audio, --, '{{ project_user }}']
        changed: false
    service_supervisor_command: "/usr/bin/pulseaudio --system --disallow-exit --disallow-module-loading --log-target=stderr"
    service_supervisor_user: "root"

  gpu:
    service_packages:
      - mesa-utils
      - vainfo
      - vulkan-tools
      - mesa-vulkan-drivers
      - mesa-va-drivers
    service_post_install_actions:
      - argv: [usermod, -a, -G, 'video,render', --, '{{ project_user }}']
        changed: false

  # === SYSTEM & ENVIRONMENT SERVICES ===
  vm:
    service_packages:
      - nodejs
    service_post_install_actions:
      - argv: [npm, link]
        chdir: /workspace

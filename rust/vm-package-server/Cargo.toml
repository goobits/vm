[package]
name = "vm-package-server"
version = { workspace = true }
edition = { workspace = true }

[lib]
name = "vm_package_server"
path = "src/lib.rs"

[features]
default = []
standalone-binary = []
cargo-tests = []
network-tests = [] # Enable tests that require network access and TLS certificates

[[bin]]
name = "pkg-server"
path = "src/main.rs"
required-features = ["standalone-binary"]

[[test]]
name = "cli_commands_e2e_test"
path = "tests/cli_commands_e2e_test.rs"
required-features = ["standalone-binary"]

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
vm-core = { path = "../vm-core" }
vm-logging = { path = "../vm-logging", features = ["http"] }
vm-packages = { path = "../vm-packages" }

[dev-dependencies]
tempfile = { workspace = true }
axum-test = "20.1"

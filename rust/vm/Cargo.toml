[package]
name = "goobits-vm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Project-aware development environment tool"
repository = "https://github.com/goobits/vm"
homepage = "https://github.com/goobits/vm"
keywords = ["development", "docker", "vm", "devenv"]
categories = ["development-tools"]

[[bin]]
name = "vm"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
clap = { workspace = true }
clap_complete = { workspace = true }
shellexpand = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
dialoguer = { workspace = true }
sysinfo = { workspace = true, features = ["serde"] }
vm-core = { path = "../vm-core" }
vm-logging = { path = "../vm-logging" }
vm-messages = { path = "../vm-messages" }
vm-config = { path = "../vm-config" }
vm-platform = { path = "../vm-platform" }
vm-plugin = { path = "../vm-plugin" }
vm-provider = { path = "../vm-provider" }
vm-temp = { path = "../vm-temp" }
vm-snapshot = { path = "../vm-snapshot" }
vm-packages = { path = "../vm-packages" }
vm-auth-proxy = { path = "../vm-auth-proxy" }
futures = "0.3.32"
chrono = "0.4.45"
rand = { workspace = true }
semver = { workspace = true }
rayon = { workspace = true }
walkdir = { workspace = true }
num_cpus = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
fs2 = { workspace = true }
url = { workspace = true }

# Release and source-installed macOS binaries always include the native Tart
# provider. The explicit feature remains available for cross-platform checks.
[target.'cfg(target_os = "macos")'.dependencies]
vm-provider = { path = "../vm-provider", features = ["tart"] }

[features]
default = []
integration = []
tart = ["vm-provider/tart"]

[package.metadata.cargo-machete]
ignored = []

[dev-dependencies]
assert_cmd = "2.2"
git2 = { workspace = true }
predicates = "3.1"
vm-provider = { path = "../vm-provider", features = ["test-helpers"] }

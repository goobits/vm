# Dependency policy for the Rust workspace.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # Local crates have explicit MIT license clarifications below.
    { allow = ["MIT"], crate = "vm-auth-proxy" },
    { allow = ["MIT"], crate = "vm-core" },
    { allow = ["MIT"], crate = "vm-package-server" },
]

[[licenses.clarify]]
crate = "vm-auth-proxy"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "vm-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "vm-package-server"
expression = "MIT"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Vibe Development Preset
# Uses a pre-built @vibe-image snapshot with Antigravity, Claude, and Codex.

# Reference pre-built vibe-image snapshot
vm_image: '@vibe-image'

tools:
  updates: prompt
  agent-skills: {}

# Host synchronization configuration (runtime behavior)
host_sync:
  git_config: true
  ai_tools: true  # Sync AI state; the Vibe base owns the CLI executables.

# JSON Schema for global VM configuration file (~/.vm/config.yaml)
# This file defines the structure and validation rules for the global configuration

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://vm-tool.org/schemas/global.schema.yaml"
title: "VM Tool Global Configuration"
description: "Global configuration for VM tool containing services and defaults that apply to all VMs"
type: object

properties:
  $schema:
    type: string
    description: "JSON Schema reference for IDE support"

  services:
    type: object
    description: "Global services configuration"
    properties:
      auth_proxy:
        $ref: "#/definitions/AuthProxySettings"
      postgresql:
        $ref: "#/definitions/DatabaseSettings"
      redis:
        $ref: "#/definitions/DatabaseSettings"
      mongodb:
        $ref: "#/definitions/DatabaseSettings"
      mysql:
        $ref: "#/definitions/DatabaseSettings"
    additionalProperties: false

  defaults:
    type: object
    description: "Default values for VM configurations"
    properties:
      provider:
        type: string
        enum: ["docker", "podman", "tart"]
        description: "Default provider when not specified in vm.yaml"
      terminal:
        $ref: "#/definitions/TerminalConfig"
      memory:
        type: integer
        minimum: 512
        maximum: 131072
        description: "Default memory allocation in MB"
      cpus:
        type: integer
        minimum: 1
        maximum: 64
        description: "Default CPU count"
      user:
        type: string
        description: "Default user in VMs"
    additionalProperties: false

  features:
    type: object
    description: "Global feature flags"
    properties:
      auto_detect_presets:
        type: boolean
        default: true
        description: "Enable automatic preset detection"
      auto_port_allocation:
        type: boolean
        default: true
        description: "Enable automatic port allocation"
      telemetry:
        type: boolean
        default: false
        description: "Enable telemetry (anonymous usage statistics)"
      update_notifications:
        type: boolean
        default: true
        description: "Enable update notifications"
    additionalProperties: false

  worktrees:
    type: object
    description: "Global git worktrees configuration"
    properties:
      enabled:
        type: boolean
        default: true
        description: "Enable git worktrees support globally"
      base_path:
        type: string
        description: "Global base directory for all worktrees (supports tilde expansion). Defaults to ~/.vm/worktrees/"
        examples:
          - ~/worktrees
          - ~/dev/worktrees
          - /mnt/worktrees
    additionalProperties: false

  backups:
    $ref: "#/definitions/BackupSettings"

  snapshots:
    $ref: "#/definitions/SnapshotSettings"

  packages:
    type: object
    description: "Shared package-infrastructure controller settings"
    properties:
      source_roots:
        type: array
        description: "Absolute host directories recursively scanned for package repositories by vm packages up"
        items:
          type: string
          minLength: 1
        uniqueItems: true
      canonical_sources:
        type: array
        description: "Exact physical Git repository roots inspected read-only for canonical workspace releases"
        items:
          type: string
          minLength: 1
        uniqueItems: true
    additionalProperties: false

  tools:
    type: object
    description: "Managed tools selected by default for every environment"
    additionalProperties:
      type: object
      properties:
        version:
          type: string
          description: "Semantic version to pin; omitted or latest tracks the newest release"
        updates:
          type: string
          enum: ["prompt", "auto", "off"]
          description: "Per-tool update-policy override"
      additionalProperties: false

additionalProperties: true

definitions:
  DatabaseSettings:
    type: object
    properties:
      enabled:
        type: boolean
        default: false
      port:
        type: integer
        minimum: 1024
        maximum: 65535
      version:
        type: string
        minLength: 1
      data_dir:
        type: string
        minLength: 1
    additionalProperties: false

  AuthProxySettings:
    type: object
    description: "Authentication proxy configuration"
    properties:
      enabled:
        type: boolean
        default: false
        description: "Whether the auth proxy is enabled"
      port:
        type: integer
        minimum: 1024
        maximum: 65535
        default: 3090
        description: "Port for the auth proxy"
      token_expiry_hours:
        type: integer
        minimum: 1
        maximum: 8760
        default: 24
        description: "Token expiry in hours"
    additionalProperties: false

  BackupSettings:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      path:
        type: string
        minLength: 1
      keep_count:
        type: integer
        minimum: 1
      databases_only:
        type: boolean
        default: true
    additionalProperties: false

  SnapshotSettings:
    type: object
    properties:
      path:
        type: string
        minLength: 1
    additionalProperties: false

  TerminalConfig:
    type: object
    description: "Terminal configuration"
    properties:
      theme:
        type: string
        description: "Terminal theme"
      shell:
        type: string
        description: "Default shell"
    additionalProperties: false

# Examples
examples:
  - # Minimal configuration
    services:
      auth_proxy:
        enabled: true

  - # Full configuration
    $schema: "https://vm-tool.org/schemas/global.schema.yaml"
    services:
      auth_proxy:
        enabled: true
        port: 3090
        token_expiry_hours: 48
    defaults:
      provider: docker
      memory: 4096
      cpus: 2
      terminal:
        theme: dracula
    features:
      auto_detect_presets: true
      auto_port_allocation: true
      telemetry: false
      update_notifications: true

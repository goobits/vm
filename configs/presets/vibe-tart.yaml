---
preset:
  name: vibe-tart
  description: "Vibe Development on Tart with a Linux guest that can run Docker"

provider: tart

vm:
  box: '@vibe-box'
  cpus: 75%
  memory: 75%
  swap: 2048
  user: developer

project:
  workspace_path: /workspace

host_sync:
  git_config: true
  ai_tools: true

terminal:
  theme: dracula
  show_git_branch: true

default_profile: tart

profiles:
  docker:
    provider: docker
  tart:
    provider: tart
    project:
      workspace_path: /workspace
    vm:
      box: vibe-tart-linux-base
    tart:
      guest_os: linux
      disk_size: 80
      ssh_user: admin
      install_docker: true
  macos:
    provider: tart
    project:
      workspace_path: /workspace
    vm:
      box: vibe-tart-sequoia-base
    tart:
      guest_os: macos
      disk_size: 80
      ssh_user: admin
      install_docker: true

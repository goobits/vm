[build]
# Host builds stay out of the repository. Managed guests inject a higher-priority
# CARGO_TARGET_DIR backed by their Docker named cache volume.
target-dir = "/tmp/vm-rust-target"

[alias]
dead-code = "clippy -- -D dead_code"
dead-deps = "machete"

# Use mold linker for faster parallel linking on Linux
# Note: mold must be installed (see install.sh)
# Commented out due to mold not being available in build environment
# [target.aarch64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

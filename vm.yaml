version: '2.0'
provider: tart
tart:
  guest_os: linux
  disk_size: 80
  ssh_user: admin
  install_docker: true
  storage_path: /Volumes/MeowDocker/Tart
project:
  hostname: dev.vm.local
  name: vm
  workspace_path: /workspace
vm:
  box: vibe-tart-linux-base
  cpus: 75%
  gui: false
  memory: 75%
  port_binding: 127.0.0.1
  swap: 2048
  swappiness: 60
  timezone: auto
  user: developer
ports:
  _range: [3120, 3129]
terminal:
  show_git_branch: true
  show_timestamp: false
  theme: dracula
  username: vm-dev
environment:
  CARGO_TARGET_DIR: /home/admin/.cache/vm-cargo-target
host_sync:
  git_config: true
  ai_tools: true

name: Security Scan

# Note: Auto-run on push disabled to reduce email spam.
# To manually trigger: Actions tab → Security Scan → Run workflow
on:
  workflow_dispatch:  # Manual trigger only
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security_scan:
    name: Run security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@d865e9aac326f15b06ac52b57abb58cd0e3330e4 # cargo-deny
        with:
          tool: cargo-deny@0.20.2

      - name: Check dependency policy
        run: cd rust && cargo deny check

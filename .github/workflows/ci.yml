name: Continuous Integration

# Runs automatically on push to main and pull requests
# Also supports manual triggering via Actions tab
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger option

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/vm-rust-target
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/vm-rust-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
        working-directory: rust
        run: cargo test --workspace --lib -- --test-threads=10

      - name: Run integration tests
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
        working-directory: rust
        run: cargo test --workspace --test '*' --features integration -- --test-threads=2

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/vm-rust-target
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/vm-rust-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all --check

      - name: Run clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  package-workflow-docker:
    name: Package workflow Docker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-package-workflow-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build VM CLI
        working-directory: rust
        run: cargo build --locked --release --package goobits-vm

      - name: Prove persistent checkout and workspace release workflows
        env:
          VM_ACCEPTANCE_BIN: ${{ github.workspace }}/rust/target/release/vm
        run: scripts/internal/test-package-workflow-docker.sh

  audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install jscpd
        run: npm install -g jscpd

      - name: Run cargo-deny
        working-directory: rust
        run: cargo deny check advisories

      - name: Check for duplicates
        run: jscpd -c .jscpd.json rust/

name: Continuous Integration

# Runs automatically on push to main and pull requests
# Also supports manual triggering via Actions tab
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger option

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/vm-rust-target
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cache/vm-rust-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Run unit tests
        working-directory: rust
        run: cargo test --workspace --lib --no-fail-fast -- --test-threads=10

      - name: Run CLI unit tests
        working-directory: rust
        run: cargo test -p goobits-vm --bin vm -- --test-threads=10

      - name: Run integration tests
        working-directory: rust
        run: cargo test --workspace --test '*' --features integration,vm-package-server/standalone-binary --no-fail-fast -- --test-threads=2

      - name: Run shell regressions
        if: matrix.os == 'ubuntu-latest'
        run: make test-shell

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/vm-rust-target
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cache/vm-rust-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all --check

      - name: Run clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  package-workflow-docker:
    name: Package workflow Docker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-package-workflow-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Build VM CLI
        working-directory: rust
        run: cargo build --locked --release --package goobits-vm

      - name: Record acceptance runtime versions
        run: |
          uname -a
          docker version
          docker compose version
          rustc --version
          cargo --version

      - name: Prove persistent checkout and workspace release workflows
        env:
          VM_ACCEPTANCE_BIN: ${{ github.workspace }}/rust/target/release/vm
          VM_ACCEPTANCE_DOCKER_RESTART_COMMAND: sudo systemctl restart docker
        run: scripts/internal/test-package-workflow-docker.sh

  audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@d865e9aac326f15b06ac52b57abb58cd0e3330e4 # cargo-deny
        with:
          tool: cargo-deny@0.20.2

      - name: Install jscpd
        run: npm install --global jscpd@5.0.16

      - name: Run cargo-deny
        working-directory: rust
        run: cargo deny check

      - name: Check for duplicates
        run: jscpd -c .jscpd.json rust/

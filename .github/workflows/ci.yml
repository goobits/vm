name: Continuous Integration

# Run explicitly from the Actions tab or gh workflow run.
on:
  workflow_dispatch:
    inputs:
      package_acceptance:
        description: Run live Docker package acceptance
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  artifact-roundtrip:
    name: Release artifact roundtrip
    runs-on: ubuntu-latest
    steps:
      - name: Create isolated artifact
        run: mkdir -p artifact-input && printf 'vm-release-artifact\n' > artifact-input/probe.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-probe
          path: artifact-input/probe.txt
          retention-days: 1
          if-no-files-found: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifact-*
          merge-multiple: true
          path: artifact-output
      - name: Verify downloaded bytes
        run: cmp artifact-input/probe.txt artifact-output/probe.txt
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/vm-rust-target
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cache/vm-rust-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Run unit tests
        working-directory: rust
        run: cargo test --workspace --lib --no-fail-fast -- --test-threads=10

      - name: Run CLI unit tests
        working-directory: rust
        run: cargo test -p goobits-vm --bin vm -- --test-threads=10

      - name: Run integration tests
        working-directory: rust
        run: cargo test --workspace --test '*' --features integration,vm-package-server/standalone-binary --no-fail-fast -- --test-threads=2

      - name: Run shell regressions
        if: matrix.os == 'ubuntu-latest'
        run: make test-shell

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/vm-rust-target
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cache/vm-rust-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all --check

      - name: Run clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  package-workflow-docker:
    name: Package workflow Docker acceptance
    if: inputs.package_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-package-workflow-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Build VM CLI
        working-directory: rust
        run: cargo build --locked --release --package goobits-vm

      - name: Record acceptance runtime versions
        run: |
          uname -a
          docker version
          docker compose version
          rustc --version
          cargo --version

      - name: Prove persistent checkout and workspace release workflows
        env:
          VM_ACCEPTANCE_BIN: ${{ github.workspace }}/rust/target/release/vm
          VM_ACCEPTANCE_DOCKER_RESTART_COMMAND: sudo systemctl restart docker
        run: scripts/internal/test-package-workflow-docker.sh

  audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@d865e9aac326f15b06ac52b57abb58cd0e3330e4 # cargo-deny
        with:
          tool: cargo-deny@0.20.2

      - name: Install jscpd
        run: npm install --global jscpd@5.0.16

      - name: Run cargo-deny
        working-directory: rust
        run: cargo deny check

      - name: Check for duplicates
        run: jscpd -c .jscpd.json rust/

name: Code Coverage

# Runs automatically on push to main and pull requests
# Also supports manual triggering via Actions tab
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger option

permissions:
  contents: read

jobs:
  coverage:
    name: Generate code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install tarpaulin
        uses: taiki-e/install-action@94f54106ddd448427843411da73d6b8a35ae69b3 # cargo-tarpaulin
        with:
          tool: cargo-tarpaulin@0.37.2

      - name: Generate coverage
        working-directory: rust
        run: cargo tarpaulin --workspace --lib --out Xml --output-dir coverage/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: rust/coverage/cobertura.xml
          fail_ci_if_error: false

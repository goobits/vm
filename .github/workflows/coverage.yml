name: Code Coverage

# Run explicitly from the Actions tab or gh workflow run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Generate code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install tarpaulin
        uses: taiki-e/install-action@d865e9aac326f15b06ac52b57abb58cd0e3330e4 # cargo-tarpaulin
        with:
          tool: cargo-tarpaulin@0.37.2

      - name: Generate coverage
        working-directory: rust
        run: cargo tarpaulin --workspace --lib --out Xml --output-dir coverage/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: rust/coverage/cobertura.xml
          fail_ci_if_error: false

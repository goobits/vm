name: Publish Tart Linux base

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tart-linux-base
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: [self-hosted, macOS, ARM64, tart-builder]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Tart
        run: |
          command -v tart >/dev/null 2>&1 || {
            echo "The protected Tart runner must provide Tart ahead of time" >&2
            exit 1
          }
          test "$(uname -m)" = arm64
          tart --version

      - name: Build Linux vibe base
        env:
          GUEST_OS: linux
          WAIT_SECONDS: 300
        run: |
          bash rust/vm/scripts/build-vibe-tart-base.sh \
            --guest-os linux \
            --name vibe-tart-linux-base

      - name: Push versioned and latest images
        env:
          TART_REGISTRY_HOSTNAME: ghcr.io
          TART_REGISTRY_USERNAME: ${{ github.actor }}
          TART_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' rust/Cargo.toml)
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/vm-tart-linux"
          probe="vm-tart-existing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'tart delete "$probe" >/dev/null 2>&1 || true' EXIT
          if tart clone "${image}:v${version}" "$probe" >/dev/null 2>&1; then
            echo "Refusing to overwrite ${image}:v${version}" >&2
            exit 1
          fi
          tart push vibe-tart-linux-base \
            "${image}:v${version}" \
            "${image}:latest"
          echo "Published ${image}:v${version}" >>"$GITHUB_STEP_SUMMARY"

      - name: Verify the image is anonymously pullable
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' rust/Cargo.toml)
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/vm-tart-linux:v${version}"
          probe="vm-tart-public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'tart delete "$probe" >/dev/null 2>&1 || true' EXIT
          tart clone "$image" "$probe"
          tart get "$probe" >/dev/null

name: VM Tool Onboarding Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vm-onboarding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install VM tool
        run: |
          set -e
          echo "Installing VM tool..."
          cargo install --path rust/vm --locked
          vm --version
        timeout-minutes: 10

      - name: Verify installed CLI with isolated Docker acceptance
        run: VM_ACCEPTANCE_BIN="$(command -v vm)" bash scripts/internal/test-provider-workflow-docker.sh
        timeout-minutes: 30

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-acceptance-diagnostics
          retention-days: 3
          if-no-files-found: ignore
          path: |
            /tmp/vm-provider-acceptance.*/run.log
            /tmp/vm-provider-acceptance.*/*.json
            /tmp/vm-provider-acceptance.*/*.txt
            /tmp/vm-provider-acceptance.*/expected-failure.log
            /tmp/vm-provider-acceptance.*/container-evidence/

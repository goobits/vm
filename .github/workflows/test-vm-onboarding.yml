name: VM Tool Onboarding Test

on:
  workflow_dispatch:
  push:
    branches: [test-vm-onboarding]

permissions:
  contents: read

jobs:
  test-vm-onboarding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install VM tool
        run: |
          set -e
          echo "Installing VM tool..."
          cargo install --path rust/vm --locked
          vm --version
        timeout-minutes: 10

      - name: Create test project
        run: |
          mkdir -p test-project
          cd test-project
          echo '{"name": "ci-test", "version": "1.0.0"}' > package.json
          echo "console.log('Hello from CI');" > index.js

      - name: Create and start VM
        run: |
          cd test-project
          vm run container
        timeout-minutes: 5
        env:
          VM_NO_PROMPT: "true"

      - name: Verify VM status
        run: |
          cd test-project
          vm list
          vm status

      - name: Execute command in VM
        run: |
          cd test-project
          vm exec -- node --version
          vm exec -- npm --version
          vm exec -- cat package.json

      - name: Test SSH (non-interactive)
        run: |
          cd test-project
          vm shell --command "echo 'SSH works in CI'"
          vm shell --command "ls -la"

      - name: Cleanup
        if: always()
        run: |
          cd test-project
          vm remove --force
          docker ps -a  # Verify cleanup

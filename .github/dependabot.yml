version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "docker"
    directory: "/"
    # Distro-series migrations include Ubuntu minor versions (e.g. 22.10).
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "docker"
    directory: "/rust/vm-package-jobs"
    # Keep the supported Node LTS line; major upgrades require Corepack migration.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/rust/vm-package-server/docker/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
